name: Rust foundation
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --all-targets --locked
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: API documentation
        run: cargo doc --workspace --no-deps --locked
  wire01-four-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: WIRE-01 Go strict canonical event / signing transcript
        run: go run ./interop/wire01/go/main.go .
      - name: WIRE-01 JavaScript strict canonical event / signing transcript
        run: node ./interop/wire01/js/check.mjs .
      - name: WIRE-01 Kotlin/JVM strict canonical event / signing transcript
        run: |
          command -v kotlinc
          kotlinc ./interop/wire01/kotlin/Main.kt -include-runtime -d "$RUNNER_TEMP/wire01-kotlin.jar"
          java -jar "$RUNNER_TEMP/wire01-kotlin.jar" .
  l001-milestone-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsupported L-001 completion claims
        run: python3 scripts/l001_gate.py
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
