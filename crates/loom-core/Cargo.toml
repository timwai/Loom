[package]
name = "loom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
experimental-lan = ["dep:getrandom", "dep:sha2", "loom-store/witness-lab"]

[[example]]
name = "l002_lan_lab"
required-features = ["experimental-lan"]

[dependencies]
loom-types = { path = "../loom-types" }
loom-crypto = { path = "../loom-crypto" }
loom-wire = { path = "../loom-wire" }
loom-identity = { path = "../loom-identity" }
loom-policy = { path = "../loom-policy" }
loom-store = { path = "../loom-store" }
loom-transport = { path = "../loom-transport" }
getrandom = { version = "0.2.17", optional = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
ed25519-dalek = "2.2.0"
rcgen = "0.13.2"
tokio = { version = "1.48.0", features = ["macros", "rt", "time", "io-util", "sync", "net"] }
tokio-rustls = "0.26.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[lints]
workspace = true
