[package]
name = "loom-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
loom-types = { path = "../loom-types" }
loom-identity = { path = "../loom-identity" }
loom-crypto = { path = "../loom-crypto" }
tokio = { version = "1.48.0", features = ["io-util"] }
tokio-rustls = "0.26.4"
sha2 = "0.10.9"
x509-parser = "0.17.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "time", "io-util", "sync", "net"] }
rcgen = "0.13.2"
ed25519-dalek = "2.2.0"
loom-wire = { path = "../loom-wire" }

[lints]
workspace = true
